name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install audio-check dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify standalone bundle without the checkout
        run: npm run test:self-host
      - name: Build Docker image
        run: docker build -t mood-rater-ci .
      - name: Verify Docker image
        run: |
          docker run -d --name mood-rater-ci -p 127.0.0.1:4174:3000 mood-rater-ci
          trap 'docker rm -f mood-rater-ci' EXIT
          MOOD_SMOKE_BASE=http://127.0.0.1:4174 npm run test:self-host
      - name: Build optional Cloudflare adapter
        run: npm run build:cloudflare
      - name: Build static demo for a repository subpath
        run: NEXT_PUBLIC_BASE_PATH=/mood-rater-demo npm run build:static
      - name: Verify static files without an application server
        run: npm run test:static
